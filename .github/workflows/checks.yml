name: Checks

# The gate before merging to main: does it compile, do the tests pass, does the
# web build that gets tested in Chrome still build. No APK here — that's the
# Release workflow's job, and only after the merge.
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze, test, web
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test --reporter expanded

      # Same command used for the Chrome check, so a broken web build is caught
      # before the merge instead of after.
      - name: Build web
        run: flutter build web --release
