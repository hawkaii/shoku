name: Checks

# The gate for every change. `android.yml` publishes; this one decides whether a
# change is allowed to reach `dev` or `main` at all. It runs on every pull
# request, and again on `dev` so a merge is never the first time the suite sees
# the combination of two branches.
on:
  pull_request:
  push:
    branches: [dev]
  workflow_dispatch:

# Read-only: a check never writes to the repository.
permissions:
  contents: read

# A second push to the same branch cancels the run for the first: only the
# latest commit matters.
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned, not `stable`. A Flutter release landing mid-week must not be able to
  # turn the same commit red without a commit of our own. `android.yml` builds
  # the shipped APK from this same version.
  FLUTTER_VERSION: 3.47.8

jobs:
  app:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Dependencies
        run: flutter pub get

      # The ARBs are the source of the generated strings. Regenerating first
      # means a stale `app_localizations*.dart` is caught here, not at runtime.
      #
      # `dart format` is explicit: `gen-l10n` formats its output on some
      # machines and not others, so without this the drift check fails on
      # whitespace that the repository already considers canonical.
      - name: Localizations
        run: |
          set -euo pipefail
          flutter gen-l10n
          dart format lib/l10n >/dev/null
          git diff --exit-code -- lib/l10n

      - name: Localization parity
        run: flutter test test/l10n_keys_test.dart --reporter expanded

      # Infos are not suggestions in this repository: an unused import or a
      # dead field is a review finding the machine can make for free.
      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  api:
    name: API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v5

      # The images run 3.12. Testing on whatever ubuntu-latest ships is how a
      # NameError that only exists on the older grammar reaches production.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Test
        run: pytest -q --maxfail=1
