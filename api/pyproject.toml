[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "shoku-api"
version = "0.1.0"
description = "Shoku backend: sync, imports, content cache, assistant, photos."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0.30",
    "alembic>=1.13",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "httpx>=0.27",
]
# Services that need a live dependency. Kept out of `dev` so the test suite
# installs and runs with no Postgres, no Redis and no network.
prod = [
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "boto3>=1.34",
]

[tool.hatch.build.targets.wheel]
packages = ["shoku_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:shoku_api.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
