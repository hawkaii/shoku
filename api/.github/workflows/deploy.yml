name: Deploy API

# Build the image once, push it, then restart it on the VM.
# Deployment is skipped (not failed) when the VM secrets are absent, so the
# build still validates the image on every push.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    name: Build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image
        run: |
          docker run --rm -d --name smoke -p 8000:8000 \
            -e SHOKU_AUTH_MODE=dev -e SHOKU_DATABASE_URL=sqlite:///./smoke.db \
            "$IMAGE:latest"
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then ok=1; break; fi
            sleep 1
          done
          docker logs smoke || true
          docker rm -f smoke
          test "${ok:-0}" = "1"

  deploy:
    name: Deploy to VM
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Write the compose file to the VM
        if: env.VM_HOST != ''
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          set -eu
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$VM_SSH_KEY" > /tmp/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i /tmp/deploy_key "$VM_USER@$VM_HOST" \
            "mkdir -p /opt/shoku && cat > /opt/shoku/docker-compose.yml" < deploy/docker-compose.prod.yml

      - name: Write env and restart
        if: env.VM_HOST != ''
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
          DB_URL: ${{ secrets.SHOKU_DATABASE_URL }}
          SUPABASE_URL: ${{ secrets.SHOKU_SUPABASE_URL }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ env.IMAGE }}
        run: |
          set -eu
          install -m 600 /dev/null /tmp/deploy_key
          printf '%s\n' "$VM_SSH_KEY" > /tmp/deploy_key
          ssh-keyscan -H "$VM_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i /tmp/deploy_key "$VM_USER@$VM_HOST" "set -eu
            cd /opt/shoku
            cat > .env <<EOF
          SHOKU_ENVIRONMENT=prod
          SHOKU_AUTH_MODE=supabase
          SHOKU_SUPABASE_URL=$SUPABASE_URL
          SHOKU_DATABASE_URL=$DB_URL
          SHOKU_QUEUE_BACKEND=memory
          SHOKU_IMAGE=$IMAGE:latest
          EOF
            echo \"\$GHCR_TOKEN\" | docker login ghcr.io -u \"$GHCR_USER\" --password-stdin
            docker compose pull
            docker compose up -d
            docker compose ps
          "
