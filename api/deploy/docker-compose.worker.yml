# Worker compose — runs on the bigger VM, not the free e2-micro.
#
# Start the worker VM only when imports are expected; it is the expensive one.
# It shares the VPC with the API, so Redis and Postgres are reachable directly.

# Stable project name: container and volume names must not depend on the
# directory the compose file is invoked from.
name: shoku

services:
  worker:
    image: ${SHOKU_IMAGE:-shoku-api:worker}
    restart: unless-stopped
    env_file: ../.env
    command: ["python", "-m", "shoku_api.imports.worker"]
    # yt-dlp and whisper are the memory spikes: one job at a time, on purpose.
    mem_limit: 3g
    environment:
      # The model cache must outlive the container. Without this the container
      # re-downloads whisper on every recreate, inside the first import's
      # 60-second budget, and the job is killed mid-download.
      HF_HOME: /opt/hf-cache
      HF_HUB_DISABLE_TELEMETRY: "1"
    volumes:
      - worker-tmp:/tmp/shoku
      - hf-cache:/opt/hf-cache
      # Platform session cookies. Not baked into the image; writable because
      # yt-dlp rewrites the jar to refresh it.
      - ../cookies.txt:/run/cookies.txt
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "2"

volumes:
  worker-tmp:
  # Kept across `--force-recreate` and rebuilds. Cold once, warm forever after.
  hf-cache:
