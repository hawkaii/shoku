name: food_finder
description: Shoku — turn reels into recipes worth keeping.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Neubrutalism UI
  neubrutalism_ui: ^2.0.2

  # State management
  flutter_riverpod: ^2.5.1

  # HTTP client
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Local storage
  sqflite: ^2.3.0
  shared_preferences: ^2.2.2
  path: ^1.8.3

  # Navigation
  go_router: ^13.0.0

  # URL handling
  url_launcher: ^6.2.4

  # UI enhancements
  shimmer: ^3.0.0
  flutter_spinkit: ^5.2.0

  # Typography
  google_fonts: ^6.1.0

  # Utilities
  intl: ^0.19.0
  equatable: ^2.0.5
  uuid: ^4.3.3

  # Image picker
  image_picker: ^1.0.7

  # Voice input
  speech_to_text: ^7.3.0

  # WebView for YouTube
  flutter_inappwebview: ^6.1.5
  smooth_page_indicator: ^3.0.0
  flutter_animate: ^4.5.2
  receive_sharing_intent: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: ShokuSerif
      fonts:
        - asset: assets/fonts/Fraunces-600.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-700.ttf
          weight: 700
    - family: ShokuSans
      fonts:
        - asset: assets/fonts/Jakarta-400.ttf
          weight: 400
        - asset: assets/fonts/Jakarta-500.ttf
          weight: 500
        - asset: assets/fonts/Jakarta-600.ttf
          weight: 600
        - asset: assets/fonts/Jakarta-700.ttf
          weight: 700
    - family: ShokuMono
      fonts:
        - asset: assets/fonts/Mono-600.ttf
          weight: 600
        - asset: assets/fonts/Mono-700.ttf
          weight: 700
