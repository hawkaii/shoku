<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#F7F3EB;color:#1C1614;font-family:sans-serif;padding:34px}
 h1{font-family:Fraunces,serif;font-size:25px;margin:0 0 4px}
 .sub{color:#6E5F58;font-size:12px;margin-bottom:22px}
 .row{display:flex;gap:20px}
 .card{flex:1;background:#FFFDF9;border:1px solid #DED5C8;border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center}
 .big{width:170px;height:170px}.big img{width:100%;height:100%}
 .lock{display:flex;align-items:center;gap:10px;margin-top:14px}
 .lock .m{width:46px;height:46px}.lock .m img{width:100%;height:100%}
 .word{font-family:Fraunces,serif;font-weight:600;font-size:30px;letter-spacing:-0.8px}
 .word span{color:#9E281E}
 .cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.1px;color:#6E5F58;margin-top:12px;text-transform:uppercase}
 .sizes{display:flex;gap:14px;align-items:flex-end;margin-top:14px;border-top:1px solid #EFE9DD;padding-top:14px;width:100%;justify-content:center}
</style></head><body>
<h1>Shoku — dish mark</h1>
<div class="sub">Plate with rim and well · tomato with calyx · one leaf · polaroid lockup with the crimson gradient</div>
<div class="row">
 <div class="card"><div class="big"><img src="8-plate-final.svg"></div>
   <div class="cap">icon</div>
   <div class="sizes"><img src="8-plate-final.svg" width="72"><img src="8-plate-final.svg" width="48"><img src="8-plate-final.svg" width="30"></div></div>
 <div class="card"><div class="big"><img src="9-polaroid-lockup.svg"></div>
   <div class="lock"><div class="m"><img src="8-plate-final.svg"></div><div class="word">Shoku<span>.</span></div></div>
   <div class="cap">polaroid lockup</div>
   <div class="sizes"><img src="9-polaroid-lockup.svg" width="96"><img src="9-polaroid-lockup.svg" width="56"><img src="9-polaroid-lockup.svg" width="34"></div></div>
</div>
</body></html>
