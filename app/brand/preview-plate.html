<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Plus+Jakarta+Sans:wght@400;600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#F7F3EB;color:#1C1614;font-family:'Plus Jakarta Sans',sans-serif;padding:36px}
 h1{font-family:Fraunces,serif;font-size:26px;margin:0 0 2px}
 .sub{color:#6E5F58;font-size:12px;margin-bottom:24px}
 .row{display:flex;gap:22px;align-items:flex-start}
 .card{background:#FFFDF9;border:1px solid #DED5C8;border-radius:14px;padding:22px;display:flex;flex-direction:column;align-items:center;flex:1}
 .big{width:190px;height:190px}
 .big img{width:100%;height:100%}
 .lock{display:flex;align-items:center;gap:10px;margin-top:16px}
 .lock .m{width:52px;height:52px}.lock .m img{width:100%;height:100%}
 .word{font-family:Fraunces,serif;font-weight:600;font-size:32px;letter-spacing:-1px}
 .word span{color:#9E281E}
 .cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.2px;color:#6E5F58;margin-top:12px;text-transform:uppercase}
 .sizes{display:flex;gap:14px;align-items:flex-end;margin-top:16px;border-top:1px solid #EFE9DD;padding-top:14px;width:100%;justify-content:center}
 .note{font-size:11px;color:#6E5F58;text-align:center;margin-top:10px;line-height:1.45;max-width:230px}
</style></head><body>
<h1>Shoku — plate polaroid</h1>
<div class="sub">Polaroid frame · crimson gradient photo · minimal plate, two veg, one knife</div>
<div class="row">
  <div class="card">
    <div class="big"><img src="4-plate-polaroid.svg"></div>
    <div class="lock"><div class="m"><img src="4-plate-polaroid.svg"></div><div class="word">Shoku<span>.</span></div></div>
    <div class="cap">A · polaroid lockup</div>
    <div class="note">The story version: a finished cook, filed like a photo.</div>
    <div class="sizes"><img src="4-plate-polaroid.svg" width="64" height="64"><img src="4-plate-polaroid.svg" width="40" height="40"><img src="4-plate-polaroid.svg" width="28" height="28"></div>
  </div>
  <div class="card">
    <div class="big"><img src="4-plate-polaroid-simple.svg"></div>
    <div class="lock"><div class="m"><img src="4-plate-polaroid-simple.svg"></div><div class="word">Shoku<span>.</span></div></div>
    <div class="cap">B · launcher icon</div>
    <div class="note">Same idea, stripped for 48 px: plate, two veg, knife, no frame.</div>
    <div class="sizes"><img src="4-plate-polaroid-simple.svg" width="64" height="64"><img src="4-plate-polaroid-simple.svg" width="40" height="40"><img src="4-plate-polaroid-simple.svg" width="28" height="28"></div>
  </div>
</div>
</body></html>
