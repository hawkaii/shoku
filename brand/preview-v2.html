<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
 body{margin:0;background:#F7F3EB;color:#1C1614;font-family:sans-serif;padding:34px}
 h1{font-family:Fraunces,serif;font-size:25px;margin:0 0 20px}
 .row{display:flex;gap:20px}
 .card{flex:1;background:#FFFDF9;border:1px solid #DED5C8;border-radius:14px;padding:20px;display:flex;flex-direction:column;align-items:center}
 .big{width:180px;height:180px}.big img{width:100%;height:100%}
 .cap{font-family:'JetBrains Mono',monospace;font-size:9px;letter-spacing:1.1px;color:#6E5F58;margin-top:12px;text-transform:uppercase}
 .sizes{display:flex;gap:14px;align-items:flex-end;margin-top:14px;border-top:1px solid #EFE9DD;padding-top:14px;width:100%;justify-content:center}
</style></head><body>
<h1>Shoku — round two</h1>
<div class="row">
 <div class="card"><div class="big"><img src="5-rim-tomato.svg"></div><div class="cap">A · rim &amp; tomato</div>
  <div class="sizes"><img src="5-rim-tomato.svg" width="64"><img src="5-rim-tomato.svg" width="40"><img src="5-rim-tomato.svg" width="28"></div></div>
 <div class="card"><div class="big"><img src="6-rim-knife.svg"></div><div class="cap">B · rim-crossing knife</div>
  <div class="sizes"><img src="6-rim-knife.svg" width="64"><img src="6-rim-knife.svg" width="40"><img src="6-rim-knife.svg" width="28"></div></div>
 <div class="card"><div class="big"><img src="7-three-cooks.svg"></div><div class="cap">C · three cooks</div>
  <div class="sizes"><img src="7-three-cooks.svg" width="64"><img src="7-three-cooks.svg" width="40"><img src="7-three-cooks.svg" width="28"></div></div>
</div>
</body></html>
